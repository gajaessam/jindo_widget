<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>수업 계획 설정</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="panel.css">
<style>
  .lessons { display: grid; gap: 12px; position: relative; padding: 8px 0; }
  .handle {
    flex: none; width: 22px; height: 30px; display: grid; place-items: center; color: #C9AE9C; font-size: 16px;
    cursor: grab; border-radius: 8px; user-select: none; touch-action: none;
  }
  .handle:hover { background: var(--soft); color: var(--accent); }
  body.is-dragging, body.is-dragging * { cursor: grabbing !important; user-select: none; }
  .dragging { opacity: 0.45; }
  .lesson.dragging { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .drop-line { position: absolute; height: 4px; border-radius: 4px; background: var(--accent); pointer-events: none; z-index: 5; box-shadow: 0 0 0 2px rgba(255, 139, 107, 0.25); }
  .lesson { background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 10px 12px; display: grid; gap: 8px; }
  .lesson-head { display: flex; align-items: center; gap: 6px; }
  .badge { flex: none; font-size: 12px; font-weight: 800; color: var(--accent); background: var(--soft); border-radius: 8px; padding: 4px 8px; font-variant-numeric: tabular-nums; }
  .lesson-head input { font-weight: 700; }
  .items { display: grid; gap: 6px; padding-left: 8px; }
  .item { display: flex; align-items: center; gap: 4px; }
  .item input { padding: 7px 10px; font-size: 13.5px; }
  .tools { display: flex; gap: 2px; flex: none; }
  .tools .icon-btn { width: 30px; height: 30px; font-size: 14px; }
  .tools .del:hover { color: var(--danger); }
  .add-item { justify-self: start; margin-left: 8px; border-style: dashed; color: var(--sub); }
  .add-lesson { border-style: dashed; color: var(--sub); width: 100%; }
  .none { font-size: 13px; color: var(--sub); padding: 2px 0 2px 8px; }
</style>
</head>
<body>
  <div class="win panel" role="dialog" aria-labelledby="title">
    <div class="win-head"><h2 id="title">수업 계획 설정</h2><button class="icon-btn" id="x" aria-label="닫기">✕</button></div>
    <p class="sub">차시와 활동은 모든 반이 함께 써요. 체크와 메모만 반마다 따로예요. "저장"을 눌러야 적용돼요.</p>
    <div class="scroll"><div class="lessons" id="lessons"></div></div>
    <button class="btn pill-btn add-lesson" id="addLesson">+ 차시 추가</button>
    <div class="foot-btns">
      <span class="hint" id="summary"></span>
      <div class="right">
        <button class="btn ghost" id="close">닫기</button>
        <button class="btn primary" id="save">저장</button>
      </div>
    </div>
  </div>
  <script src="panel-common.js"></script>
  <script src="plan.js"></script>
</body>
</html>
