<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>반 · 캐릭터 설정</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="panel.css">
<style>
  .cls { display: grid; grid-template-columns: 44px 1fr auto; gap: 8px; align-items: center; }
  .thumb { width: 44px; height: 44px; border-radius: 12px; background: var(--soft); display: grid; place-items: center; overflow: hidden; color: var(--sub); font-size: 22px; }
  .thumb img { max-width: 40px; max-height: 40px; object-fit: contain; }
  .cls input { padding: 7px 10px; }
  .acts { display: flex; gap: 4px; }
  .acts .icon-btn { width: 30px; height: 30px; font-size: 14px; }
  .class-list { display: grid; gap: 8px; }
  .slider { display: flex; align-items: center; gap: 10px; }
  .slider b { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }
</style>
</head>
<body>
  <div class="win panel" role="dialog" aria-labelledby="title">
    <div class="win-head"><h2 id="title">반 · 캐릭터 설정</h2><button class="icon-btn" id="x" aria-label="닫기">✕</button></div>
    <p class="sub">바꾸는 동안 바탕 화면에 바로 미리 보여요. "저장"을 눌러야 확정되고, "닫기"를 누르면 원래대로 돌아가요.</p>
    <div class="scroll">
      <div class="group">
        <div class="row-between">
          <h3>수업하는 반</h3>
          <div class="row-between" style="gap:6px">
            <button class="btn round" id="minus" aria-label="반 줄이기">−</button>
            <span class="num" id="count" aria-live="polite"></span>
            <button class="btn round" id="plus" aria-label="반 늘리기">+</button>
          </div>
        </div>
        <div class="class-list" id="list"></div>
      </div>
    </div>
    <div class="group">
      <div class="row-between">
        <span>캐릭터 크기</span>
        <span class="slider"><input type="range" id="scale" min="50" max="150" step="10" aria-label="캐릭터 크기"><b id="scaleVal"></b></span>
      </div>
      <div class="row-between">
        <span>대기 동작</span>
        <div class="seg" role="group" aria-label="대기 동작">
          <button id="floatOn" aria-pressed="false">살짝 둥둥</button>
          <button id="floatOff" aria-pressed="true">멈춤</button>
        </div>
      </div>
      <div class="row-between">
        <span>캐릭터 위 진도율 표시</span>
        <button class="switch" id="labels" role="switch" aria-checked="true" aria-label="캐릭터 위 진도율 표시"></button>
      </div>
    </div>
    <div class="btns">
      <button class="btn ghost" id="close">닫기</button>
      <button class="btn primary" id="save">저장</button>
    </div>
  </div>
  <script src="panel-common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
