<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:">
  <title>급식알리미</title>
  <link rel="stylesheet" href="widget.css">
</head>
<body>
  <main id="root">
    <section class="bubble" id="bubble" aria-live="polite">
      <header class="bubble-head">
        <button class="icon-button" id="prevDay" aria-label="이전 날짜">‹</button>
        <strong id="dayLabel"></strong>
        <button class="icon-button" id="nextDay" aria-label="다음 날짜">›</button>
        <div class="chips" id="chips"></div>
        <button class="icon-button close" id="closeBubble" aria-label="말풍선 닫기">×</button>
      </header>
      <div class="update" id="update" hidden>
        <div class="update-text">
          <strong id="updateTitle"></strong>
          <p id="updateNotes"></p>
        </div>
        <button type="button" class="update-now" id="updateNow">지금 업데이트</button>
        <button type="button" class="icon-button update-later" id="updateLater" aria-label="업데이트 안내 닫기" title="나중에 (앱을 끌 때 설치돼요)">×</button>
      </div>
      <p class="speech" id="speech"></p>
      <ul class="dishes" id="dishes"></ul>
      <button class="kcal" id="kcal" hidden></button>
      <dl class="nutrition" id="nutrition" hidden></dl>
      <p class="status" id="status" hidden></p>
    </section>

    <div class="character" id="character" data-mood="default" title="클릭: 말 걸기 · 드래그: 옮기기 · 우클릭: 메뉴">
      <img id="characterImage" alt="" draggable="false" hidden>
      <svg id="characterDefault" viewBox="0 0 200 180" aria-hidden="true">
        <path class="rice" d="M100 14c13 0 22 8 30 22l48 86c13 24-2 44-28 44H50c-26 0-41-20-28-44l48-86c8-14 17-22 30-22z"/>
        <path class="nori" d="M68 166v-44c0-5 4-8 8-8h48c4 0 8 3 8 8v44z"/>
        <circle class="blush" cx="54" cy="104" r="11"/>
        <circle class="blush" cx="146" cy="104" r="11"/>
        <g class="face face-default">
          <circle cx="74" cy="86" r="7"/><circle cx="126" cy="86" r="7"/>
          <path d="M90 94q10 10 20 0"/>
        </g>
        <g class="face face-happy">
          <path d="M64 90q10-14 20 0"/><path d="M116 90q10-14 20 0"/>
          <path class="mouth" d="M86 94q14 22 28 0z"/>
        </g>
        <g class="face face-sad">
          <path d="M62 80l18-7"/><path d="M138 80l-18-7"/>
          <circle cx="74" cy="92" r="6"/><circle cx="126" cy="92" r="6"/>
          <path d="M90 108q10-10 20 0"/>
        </g>
        <g class="face face-sleepy">
          <path d="M64 88h20"/><path d="M116 88h20"/>
          <circle class="mouth" cx="100" cy="102" r="6"/>
        </g>
      </svg>
    </div>
  </main>
  <script src="../shared/lines.js"></script>
  <script src="../shared/logic.js"></script>
  <script src="widget.js"></script>
</body>
</html>
